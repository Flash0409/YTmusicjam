<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121212">
<title>YT Music Jam</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#121212;color:#fff;font:15px/1.4 Roboto,system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:#aaa;margin-bottom:18px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:16px}
  .btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:24px;background:#ff0033;color:#fff;
       font-weight:600;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
  .btn.g{background:#2e2e2e}
  .small{color:#888;font-size:12px;margin-top:6px}
  .player{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
  .player iframe,.player #player{position:absolute;inset:0;width:100%;height:100%}
  .controls{display:flex;gap:8px;margin-top:10px}
  .controls .btn{margin:0;font-size:14px;padding:11px}
  .status{color:#aaa;font-size:13px;margin:10px 0}
  .warn{color:#ffb4b4}
  .add{display:flex;gap:8px;margin-top:14px}
  .add .btn{width:auto;margin:0;padding:0 18px}
  h2{font-size:16px;margin:18px 0 6px}
  ol{padding-left:22px;margin:0}
  li{margin:8px 0}
  li .a{color:#aaa;font-size:12px}
  li button{float:right;background:none;border:0;color:#888;font-size:16px;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- Join screen -->
  <div id="joinView">
    <h1>🎧 YT Music Jam</h1>
    <div class="sub">Listen together, in sync.</div>
    <input id="room" placeholder="Room name">
    <div style="height:10px"></div>
    <input id="name" placeholder="Your name">
    <button class="btn" id="go">Join &amp; listen here</button>
    <a class="btn g" id="ytm" target="_blank">Open in YouTube Music (desktop extension)</a>
    <div class="small">On a computer with the YT Music Jam extension, use the second button for the full YouTube Music experience.</div>
  </div>

  <!-- Jam screen -->
  <div id="jamView" hidden>
    <div class="player"><div id="player"></div></div>
    <div class="status" id="status">Connecting…</div>
    <div class="controls">
      <button class="btn" id="pp">⏯ Play / Pause</button>
      <button class="btn g" id="skip">⏭ Next</button>
      <button class="btn g" id="invite">🔗 Invite</button>
    </div>
    <div class="add">
      <input id="link" placeholder="Paste a YouTube / YT Music link">
      <button class="btn" id="addBtn">Add</button>
    </div>
    <h2>Up next</h2>
    <ol id="queue"></ol>
    <div class="small" id="empty">Queue is empty. Paste a song link to add one.</div>
    <h2>Listening</h2>
    <div id="members" class="small"></div>
  </div>
</div>

<script>
const DRIFT_LIMIT = 1.5, HEARTBEAT_MS = 5000;
const $ = (id) => document.getElementById(id);
const roomFromPath = decodeURIComponent((location.pathname.match(/^\/r\/([^/]+)/) || [])[1] || '');
$('room').value = roomFromPath;
$('name').value = localStorage.getItem('jamName') || '';
const ytmLink = () => `https://music.youtube.com/?jam=${encodeURIComponent($('room').value.trim())}`;
$('ytm').href = ytmLink();
$('room').oninput = () => { $('ytm').href = ytmLink(); };

let ws, player, playerReady = false, ytApiReady = false;
let room = '', name = '';
let session = { isHost: false }, queue = [], members = [];
let applying = false, pending = null, lastT = 0, beat = 0, nextRequestedFor = null;

// ---------- YouTube player ----------
window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);

function createPlayer() {
  if (!ytApiReady) return setTimeout(createPlayer, 200);
  player = new YT.Player('player', {
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { playerReady = true; if (pending) { const p = pending; pending = null; apply(p); } },
      onStateChange,
      onError: () => setStatus('This song can’t play outside YouTube (blocked by the label). Skip or add another.', true),
    },
  });
}

const curId = () => (playerReady && player.getVideoData ? player.getVideoData().video_id : null);
const isPlaying = () => playerReady && player.getPlayerState() === YT.PlayerState.PLAYING;

function onStateChange(e) {
  if (applying) return;
  if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.PAUSED) push();
  if (e.data === YT.PlayerState.ENDED && session.isHost && queue.length) requestNext(curId());
}

function push() {
  const id = curId();
  if (!id || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'state', videoId: id, position: player.getCurrentTime(), playing: isPlaying() }));
}

function requestNext(fromId) {
  if (nextRequestedFor === fromId) return;
  nextRequestedFor = fromId;
  ws.send(JSON.stringify({ type: 'queue_next', fromVideoId: fromId }));
}

function apply(st) {
  if (!st || !st.videoId) return;
  if (!playerReady) { pending = { ...st, elapsed: st.elapsed || 0, receivedAt: Date.now() }; return; }
  const age = (st.elapsed || 0) + (st.receivedAt ? Date.now() - st.receivedAt : 0);
  const expected = st.position + (st.playing ? age / 1000 : 0);
  applying = true;
  if (st.videoId !== curId()) {
    if (st.playing) player.loadVideoById({ videoId: st.videoId, startSeconds: expected });
    else player.cueVideoById({ videoId: st.videoId, startSeconds: expected });
  } else {
    if (Math.abs(player.getCurrentTime() - expected) > DRIFT_LIMIT) player.seekTo(expected, true);
    if (st.playing && !isPlaying()) player.playVideo();
    if (!st.playing && isPlaying()) player.pauseVideo();
  }
  setTimeout(() => { applying = false; lastT = player.getCurrentTime(); }, 1500);
}

setInterval(() => {
  if (!playerReady || !ws || ws.readyState !== 1) return;
  const t = player.getCurrentTime(), id = curId();
  // Detect manual seeks from the embedded player's own controls
  if (!applying && isPlaying() && Math.abs(t - (lastT + 1)) > 2.5) push();
  lastT = t;
  if (session.isHost && isPlaying()) {
    const d = player.getDuration();
    if (queue.length && d && d - t < 1.5) requestNext(id);
    beat += 1000;
    if (beat >= HEARTBEAT_MS) { beat = 0; push(); }
  }
}, 1000);

// ---------- Connection ----------
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', room, name })); setStatus('Connected'); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case 'welcome':
        session.isHost = m.isHost; queue = m.queue || []; render();
        if (m.state) apply({ ...m.state, receivedAt: Date.now() });
        else setStatus(m.isHost ? 'You’re the host. Paste a song link to start!' : 'Waiting for the host to play something…');
        break;
      case 'state': apply({ ...m.state, receivedAt: Date.now() }); setStatus(`Synced · last change by ${m.state.by}`); break;
      case 'queue': queue = m.queue; render(); break;
      case 'members': members = m.members; render(); break;
      case 'host': session.isHost = true; render(); break;
    }
  };
  ws.onclose = () => { setStatus('Reconnecting…', true); setTimeout(connect, 3000); };
}
setInterval(() => ws && ws.readyState === 1 && ws.send('{"type":"ping"}'), 20000);

// ---------- UI ----------
function setStatus(text, warn) { $('status').textContent = text; $('status').className = 'status' + (warn ? ' warn' : ''); }

function render() {
  $('members').textContent = members.map((m) => (m.host ? '👑 ' : '') + m.name).join(', ');
  const ol = $('queue');
  ol.textContent = '';
  for (const q of queue) {
    const li = document.createElement('li');
    const x = document.createElement('button');
    x.textContent = '✕';
    x.onclick = () => ws.send(JSON.stringify({ type: 'queue_remove', id: q.id }));
    const t = document.createElement('div'); t.textContent = q.title || 'Loading…';
    const a = document.createElement('div'); a.className = 'a';
    a.textContent = [q.artist, `added by ${q.by}`].filter(Boolean).join(' · ');
    li.append(x, t, a);
    ol.appendChild(li);
  }
  $('empty').hidden = queue.length > 0;
}

$('go').onclick = () => {
  room = $('room').value.trim();
  name = $('name').value.trim() || 'Guest';
  if (!room) return $('room').focus();
  localStorage.setItem('jamName', name);
  history.replaceState(null, '', '/r/' + encodeURIComponent(room));
  $('joinView').hidden = true;
  $('jamView').hidden = false;
  createPlayer(); // created from a tap so phones allow playback
  connect();
};

const parseId = (s) => (s.match(/(?:[?&]v=|youtu\.be\/)([\w-]{11})/) || [])[1];
function addLink() {
  const id = parseId($('link').value);
  if (!id) return setStatus('That doesn’t look like a YouTube link', true);
  ws.send(JSON.stringify({ type: 'queue_add', videoId: id }));
  $('link').value = '';
  // Nothing playing yet? Start the queue right away
  if (!curId()) setTimeout(() => queue.length && requestNext(null), 300);
}
$('addBtn').onclick = addLink;
$('link').onkeydown = (e) => { if (e.key === 'Enter') addLink(); };
$('pp').onclick = () => { if (!playerReady) return; isPlaying() ? player.pauseVideo() : player.playVideo(); };
$('skip').onclick = () => { if (queue.length) { nextRequestedFor = null; requestNext(curId()); } else setStatus('Nothing in the queue', true); };
$('invite').onclick = async () => {
  const link = `${location.origin}/r/${encodeURIComponent(room)}`;
  if (navigator.share) { try { await navigator.share({ title: 'Join my YT Music Jam', url: link }); return; } catch {} }
  try { await navigator.clipboard.writeText(link); setStatus('Invite link copied!'); }
  catch { prompt('Copy this invite link:', link); }
};
</script>
</body>
</html>
